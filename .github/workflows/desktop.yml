name: Build Windows desktop app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-app.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name GazeRefine --collect-all timm --collect-all matplotlib --collect-all pydicom desktop_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: GazeRefine-Windows-CPU
          path: dist/GazeRefine
          retention-days: 30
